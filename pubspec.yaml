name: personal_trainer_app
description: A Flutter mobile app for personal trainers and clients with offline-first architecture, dual authentication flows, and Stripe payments.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  app_links: ^4.0.1
  cached_network_image: ^3.3.1
  connectivity_plus: ^5.0.2
  crypto: ^3.0.3
  dartz: ^0.10.1
  device_info_plus: ^10.0.0
  dio: ^5.4.3+1
  drift: ^2.16.0
  dynamic_color: ^1.7.0
  equatable: ^2.0.5
  firebase_analytics: ^10.8.9
  firebase_core: ^2.27.1
  firebase_crashlytics: ^3.4.18
  firebase_messaging: ^14.7.19
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^17.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  flutter_secure_storage: ^9.0.0
  flutter_stripe: ^10.1.1
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.1
  go_router: ^14.0.2
  google_fonts: ^6.1.0
  intl: ^0.19.0
  json_annotation: ^4.8.1
  local_auth: ^2.2.0
  lottie: ^3.1.0
  path: ^1.9.0
  path_provider: ^2.1.2
  pretty_dio_logger: ^1.3.1
  riverpod: ^2.5.0
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  sqlite3_flutter_libs: ^0.5.20
  uni_links: ^0.5.1
  uuid: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.3.11
  flutter_test:
    sdk: flutter
  freezed: ^2.4.7
  go_router_builder: ^2.4.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.7.1
  mocktail: ^1.0.3
  patrol: ^3.6.1
  riverpod_generator: ^2.3.11
  very_good_analysis: ^5.1.0

flutter:
