name: personal_trainer_app
description: A Flutter mobile app for personal trainers and clients with offline-first architecture, dual authentication flows, and Stripe payments.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Dependency Injection
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  riverpod_generator: ^2.4.0

  # Navigation
  go_router: ^14.0.0

  # Database
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.1
  path: ^1.8.3

  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.0
  http: ^1.1.0

  # Authentication & Security
  flutter_secure_storage: ^9.2.1
  local_auth: ^2.2.0

  # UI Components
  google_fonts: ^6.1.0
  cached_network_image: ^3.4.0

  # Payments
  flutter_stripe: ^11.0.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.0.0
  firebase_storage: ^12.1.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Serialization
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1

  # Utils
  intl: ^0.19.0
  fpdart: ^1.1.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.0
  drift_dev: ^2.15.0
  riverpod_generator: ^2.4.0
  freezed: ^2.4.1
  json_serializable: ^6.7.1

  # Testing
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
